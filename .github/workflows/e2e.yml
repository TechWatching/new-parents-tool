name: E2E Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.15.0
        with:
          node-version: 22
          cache: true

      - name: Install Playwright browsers
        run: pnpm --filter bottle-feeds exec playwright install --with-deps chromium

      - name: Run e2e tests
        run: vp run --filter bottle-feeds test:e2e
