name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.15.0
        with:
          node-version: 22
          cache: true

      - name: Install Playwright browsers
        run: vp exec --filter bottle-feeds playwright install --with-deps chromium

      # The agent firewall blocks api.github.com for processes the agent starts
      # itself, so `apm install` cannot run from an agent session. Setup steps
      # are exempt, so the primitives declared in apm.yml are installed here and
      # are already on disk when the session starts.
      - name: Install agent primitives
        uses: microsoft/apm-action@v1.10.0
