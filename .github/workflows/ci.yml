name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.15.0
        with:
          node-version: 22
          cache: true

      - name: Lint
        run: vp run --recursive lint

      - name: Test
        run: vp run --filter bottle-feeds test:unit -- --run

      - name: Type check
        run: vp run --filter bottle-feeds type-check

      - name: Build
        run: vp run --recursive build
