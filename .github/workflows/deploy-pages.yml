name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.15.0
        with:
          node-version: 22
          cache: true

      - name: Build GitHub Pages site
        run: vp run --filter bottle-feeds build-only -- --base /new-parents-tool/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/bottle-feeds/dist

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5
