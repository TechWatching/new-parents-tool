name: Bug report
description: Report unexpected behavior in Little Sips.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Please do not include real baby health records, invitation links, access tokens, or credentials."
  - type: input
    id: summary
    attributes:
      label: What happened?
      description: Give a short summary of the unexpected behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the smallest set of steps that reproduces the issue.
      placeholder: |
        1. Open the app...
        2. ...
        3. Observe...
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: App mode
      options:
        - Local only
        - Shared family
        - Offline
        - Not sure
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: "For example: Firefox on Windows 11"
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add sanitized logs or screenshots, but remove personal health data and secrets first.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed real health records, invitation links, access tokens, and credentials from this report.
          required: true
